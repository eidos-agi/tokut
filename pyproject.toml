[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tokut"
version = "0.3.1"
description = "Local AI cost consultant, token-burn dashboard, and inference-key store for Codex, Claude, Gemini, Grok, and Hermes."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Eidos AGI", email = "hello@eidosagi.com" }]
keywords = ["tokens", "ai", "codex", "claude", "gemini", "grok", "costs", "dashboard", "billing"]

[project.scripts]
tokut = "tokut.server:main"

[tool.setuptools.packages.find]
include = ["tokut*"]

[tool.setuptools.package-data]
tokut = ["site/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
